[build-system]
# >=77 for PEP 639 license metadata (the `license = "MIT"` SPDX form below).
requires = ["setuptools>=77.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
# The distribution name is what `pip install`, `uv tool install` and the
# Homebrew formula all key off, so it is the user-facing name: trrnt.
# "torrent-cli" was a working title and is somebody else's package on PyPI.
name = "trrnt"
# Single source of truth is trrnt/__init__.py, so a release bump is one edit
# and `trrnt --version` cannot drift from the published package.
dynamic = ["version"]
description = "Terminal torrent aggregator & downloader with VPN kill switch"
readme = "README.md"
requires-python = ">=3.10"
license = "MIT"
license-files = ["LICENSE"]
authors = [{ name = "trrnt" }]
keywords = ["torrent", "bittorrent", "tui", "terminal", "jackett", "aria2", "plex"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Environment :: Console",
    "Intended Audience :: End Users/Desktop",
    "Operating System :: MacOS :: MacOS X",
    "Programming Language :: Python :: 3",
    "Topic :: Communications :: File Sharing",
    "Topic :: Terminals",
]
dependencies = [
    "textual>=0.47.0",
    "rich>=13.7.0",
    "click>=8.1.0",
    "httpx>=0.27.0",
    "pyyaml>=6.0",
    "xmltodict>=0.13.0",
]

[project.optional-dependencies]
dev = ["pytest>=8.0"]

[project.urls]
Homepage = "https://github.com/BeauOuellette/trrnt"
Repository = "https://github.com/BeauOuellette/trrnt"
Issues = "https://github.com/BeauOuellette/trrnt/issues"

[project.scripts]
trrnt = "trrnt.main:cli"
# Legacy name kept as an alias so older habits and docs keep working.
tget = "trrnt.main:cli"

[tool.setuptools.dynamic]
version = { attr = "trrnt.__version__" }

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
trrnt = ["config.example.yaml"]

[tool.pytest.ini_options]
testpaths = ["tests"]
