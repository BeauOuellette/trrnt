# trrnt configuration
# Copy to ~/.config/trrnt/config.yaml and fill in your values

# Jackett settings
jackett:
  url: "http://localhost:9117"
  api_key: "YOUR_JACKETT_API_KEY"
  # Indexer names to search (empty = all)
  indexers: []
  # Indexer ids to skip — e.g. ones behind Cloudflare that error on every
  # search. Manage these from the TUI with Ctrl+N rather than by hand.
  exclude_indexers: []
  # Timeout in seconds
  timeout: 30
  # Per-indexer ceiling, so one slow tracker can't stall the whole search.
  # Defaults to `timeout` when unset. 30s is deliberately chosen: a
  # Cloudflare-gated indexer with a fresh cookie answers in ~14s and makes it,
  # while one needing a new cookie takes ~39s and gets skipped — with a toast
  # offering to repair it. Raising this trades a fast first search for fewer
  # skips.
  indexer_timeout: 30

# Cloudflare solver
solver:
  # Some trackers (1337x and the KickassTorrents mirrors among them) sit behind
  # Cloudflare, and Jackett cannot answer that challenge on its own. With this
  # on, trrnt runs a private FlareSolverr — with its own bundled browser, never
  # yours — for the few seconds a challenge takes, then shuts it down.
  #
  # Jackett stores the resulting cookie and reuses it, so this runs on repair,
  # not on every search. Set up during `trrnt setup`; ^y repairs on demand.
  enabled: true
  # Port for the local solver. Loopback only. If something already holds this
  # one, trrnt quietly takes another and tells Jackett where it landed.
  port: 8191
  # Seconds to let a single challenge run before giving up on it.
  timeout: 120

# aria2 RPC settings
aria2:
  rpc_url: "http://localhost:6800/jsonrpc"
  rpc_secret: ""
  # Download directory (default for uncategorized)
  download_dir: "~/Downloads/torrents"
  # Max concurrent downloads. Extra torrents queue rather than all crawling
  # along at once.
  max_concurrent: 3
  # Global speed limits, in aria2's notation: bare bytes/sec, or a number with
  # a K or M suffix. "0" is unlimited. Capping upload is usually what keeps the
  # rest of your connection usable while seeding.
  max_download_rate: "0"
  max_upload_rate: "0"
  # Seeding. These two zeroes mean opposite things — that is aria2's design,
  # not ours, and getting it backwards is the classic mistake:
  #   seed_ratio: 0   seed FOREVER, ignoring ratio
  #   seed_time:  0   never seed at all; stop the moment a download completes
  #   seed_time:  ""  no time limit (stop on ratio alone)
  # With both set, seeding ends as soon as either one is reached.
  seed_ratio: 2.0
  seed_time: ""
  # BitTorrent listen port. A range is fine. Pin a single port if your VPN
  # forwards one — being connectable is most of what makes a swarm fast.
  listen_port: "6881-6999"
  # MSE/PE peer encryption:
  #   "off"      plaintext BitTorrent, visible to anything on the path
  #   "prefer"   encrypt when the peer offers it, still talk to legacy peers
  #   "require"  refuse unencrypted peers entirely (smaller swarm)
  encryption: "prefer"
  # Local Peer Discovery broadcasts what you are downloading to your local
  # network — which is outside the VPN tunnel by design. aria2's own default
  # is off and so is ours; turn it on only on a network you trust.
  enable_lpd: false
  # Interface every aria2 socket binds to — peers, trackers and DHT.
  #   ""       auto-detect the tunnel carrying traffic (recommended)
  #   "utun4"  pin one by hand; aria2 refuses to start if it is missing
  #   "none"   no binding at all, traffic follows the default route
  # Empty with vpn.enabled means trrnt will not start aria2 at all unless a
  # real tunnel is up, since binding is the only thing that actually keeps
  # BitTorrent inside the VPN — the connectivity check just samples a moment.
  bt_interface: ""
  # aria2 event backend: "" (aria2 default, kqueue on macOS), "poll", or "select".
  # Set this to "poll" if aria2c ever pins a CPU core while sitting idle.
  event_poll: ""

# VPN settings
vpn:
  # Enable VPN enforcement
  enabled: true
  # VPN tunnel interface prefix (macOS ProtonVPN uses utun)
  interface_prefix: "utun"
  # Your real ISP IP (optional, for double-check)
  real_ip: ""
  # IP check service
  ip_check_url: "https://ipinfo.io/ip"
  # Kill switch polling interval (seconds)
  kill_switch_interval: 5

# Plex settings
plex:
  enabled: true
  url: "http://localhost:32400"
  token: "YOUR_PLEX_TOKEN"
  # Library section IDs to scan after download
  # Find with: curl "http://localhost:32400/library/sections?X-Plex-Token=TOKEN"
  library_sections:
    movies: 1
    tv: 2

# Download categories → directories
# These map to auto-detected content types
categories:
  movies:
    path: "~/Media/Movies"
    quality_prefer: ["2160p", "1080p", "x265"]
  tv:
    path: "~/Media/TV"
    quality_prefer: ["1080p", "x265"]
  music:
    path: "~/Media/Music"
  audiobooks:
    path: "~/Media/Audiobooks"
  comics:
    path: "~/Media/Comics"
  ebooks:
    path: "~/Media/Ebooks"
  other:
    path: "~/Downloads/torrents"

# What happens when a category's drive isn't connected.
# Media categories usually live on an external drive; without this, a download
# to an unplugged drive fails partway through with a cryptic aria2 error.
destinations:
  # "fallback" → download locally instead and say so
  # "abort"    → refuse the download with a clear error
  on_unavailable: "fallback"
  # Where redirected downloads land. The category name is appended,
  # so a movie becomes ~/Downloads/torrents/movies.
  fallback_path: "~/Downloads/torrents"
  # Require paths on external volumes to be real mount points. Without this,
  # the empty folder an unplugged drive leaves behind would quietly absorb
  # downloads onto the boot disk — and the real drive would then mount
  # alongside it as "<name> 1".
  require_mount: true

# Download organizing
organize:
  # Before each TUI download, a prompt pre-fills a clean name and destination
  # from the release title ("The.Agency.S02E03.2160p..." → "The Agency S02E03"
  # → TV/The Agency/Season 2). Enter accepts, "As-is" skips renaming for that
  # download, Esc skips the download.
  rename_prompt: true
  # Deselect junk files inside torrents before any payload byte downloads —
  # they never hit the disk at all.
  exclude_junk: true
  # File types treated as junk. Cover art is kept for music/audiobooks and
  # .txt is kept for ebooks automatically; subtitles are never junk.
  junk_extensions:
    - .nfo
    - .sfv
    - .srr
    - .srs
    - .diz
    - .url
    - .website
    - .torrent
    - .md5
    - .sha1
    - .sha256
    - .txt
    - .jpg
    - .jpeg
    - .png
    - .gif
    - .bmp
    - .webp
    - .htm
    - .html

# Security settings
security:
  # ClamAV virus scanning
  clamav_enabled: true
  # clamd socket path (macOS default after brew install)
  clamav_socket: "/tmp/clamd.socket"
  # Quarantine directory for flagged downloads
  quarantine_dir: "~/Downloads/quarantine"
  # Scan every completed download before moving to media library
  scan_on_complete: true
  # Block password-protected archives (common malware vector)
  block_password_protected_archives: true
  # Blocked file extensions — executables/scripts that shouldn't be in media downloads
  blocked_extensions:
    - .exe
    - .bat
    - .cmd
    - .ps1
    - .scr
    - .vbs
    - .vbe
    - .msi
    - .dll
    - .com
    - .js
    - .hta
    - .lnk
    - .pif
    - .wsf
    - .app

# Quality filter keywords (exclude results matching these)
quality_exclude:
  - "CAM"
  - "TS"
  - "HDCAM"

# Display settings
display:
  # Max results to show
  max_results: 50
  # Default sort: seeders, size, name
  default_sort: "seeders"
  # Land on the home screen (logo, quick search, service health) at launch.
  # Esc leaves it for the working screen. Set false to skip it entirely.
  home: true
